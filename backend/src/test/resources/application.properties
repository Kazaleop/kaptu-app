# =====================================================================
# Kaptu API - perfil de testes
# H2 em memoria: os testes nao dependem de Postgres nem de variaveis DB_*.
# =====================================================================

spring.datasource.url=jdbc:h2:mem:kaptu-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# OCR/arquivos temporarios usados apenas em teste
kaptu.pasta-arquivos=./target/test-arquivos
kaptu.ocr.tessdata=./tessdata

# Sem autenticacao nos testes
kaptu.auth.enabled=false

# Supabase desligado por padrao nos testes
supabase.url=
supabase.secret-key=
supabase.storage.bucket=

app.cors.allowed-origins=http://localhost:5173
