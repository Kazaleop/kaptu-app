# =====================================================================
# Kaptu API - configuracao base (producao)
spring.config.import=optional:file:.env[.properties]
# NENHUM segredo deve ser versionado neste arquivo.
# Em producao (Railway) defina as variaveis de ambiente descritas em
# SECURITY.md e .env.example. A aplicacao falha ao iniciar se DB_URL,
# DB_USERNAME ou DB_PASSWORD nao estiverem definidos.
# =====================================================================

# --- Banco de dados (obrigatorio) ------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate -------------------------------------------------
# validate: nao altera o schema em producao (recomendado)
# update:   somente para desenvolvimento local
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# --- Console H2 (somente desenvolvimento) ----------------------------
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.settings.web-allow-others=${H2_CONSOLE_WEB_ALLOW_OTHERS:false}

# --- CORS ------------------------------------------------------------
# Lista separada por virgula. Informe apenas as origens reais do frontend.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Arquivos / OCR --------------------------------------------------
kaptu.pasta-arquivos=${KAPTU_PASTA_ARQUIVOS:./arquivos}
kaptu.ocr.tessdata=${KAPTU_OCR_TESSDATA:./tessdata}

# --- Upload ----------------------------------------------------------
spring.servlet.multipart.max-file-size=${KAPTU_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${KAPTU_MAX_REQUEST_SIZE:10MB}

# --- Autenticacao -----------------------------------------------------
kaptu.auth.enabled=${KAPTU_AUTH_ENABLED:true}
kaptu.auth.secret=${KAPTU_AUTH_SECRET:}
kaptu.auth.expiracao-horas=${KAPTU_AUTH_EXPIRACAO_HORAS:8}
# A conta so e criada quando AMBOS estiverem definidos.
# Nunca versione a senha. Minimo de 12 caracteres.
kaptu.admin.email=${KAPTU_ADMIN_EMAIL:}
kaptu.admin.senha=${KAPTU_ADMIN_SENHA:}

# --- Respostas de erro -----------------------------------------------
# Nao expor detalhes internos, stack traces ou nome da excecao.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# --- Proxy reverso (Railway) -----------------------------------------
server.forward-headers-strategy=framework
server.port=${PORT:8080}

# --- Supabase Storage ---
supabase.url=${SUPABASE_URL:}
supabase.secret-key=${SUPABASE_SECRET_KEY:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:Documentos}