$kind: http-request
name: 'Gerar Relatório'
url: '{{base_url}}/api/v1/financeiro/relatorio-mpse?inicio=2026-01-01&fim=2026-12-31'
method: GET
queryParams:
  - key: inicio
    value: '2026-01-01'
    disabled: false
    description: ""
  - key: fim
    value: '2026-12-31'
    disabled: false
    description: ""
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Resposta em menos de 2000ms", () => pm.expect(pm.response.responseTime).to.be.below(2000));
      pm.test("Content-Type é PDF", () => pm.response.to.have.header("Content-Type", /application\/pdf/));
      pm.test("Content-Disposition indica arquivo", () => pm.response.to.have.header("Content-Disposition", /attachment/));
