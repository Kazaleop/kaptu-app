$kind: http-request
name: 'Conciliar Transação'
url: '{{base_url}}/api/v1/financeiro/conciliar'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "transacaoId": 1,
      "documentoId": 1
    }
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Resposta em menos de 2000ms", () => pm.expect(pm.response.responseTime).to.be.below(2000));
