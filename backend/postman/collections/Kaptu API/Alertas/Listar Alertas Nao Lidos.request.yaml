$kind: http-request
name: 'Listar Alertas Não Lidos'
method: GET
url: '{{base_url}}/api/v1/alertas/nao-lidos'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Resposta em menos de 2000ms", () => pm.expect(pm.response.responseTime).to.be.below(2000));
      pm.test("Content-Type é JSON", () => pm.response.to.have.header("Content-Type", /application\/json/));
      pm.test("Corpo é um array", () => pm.expect(pm.response.json()).to.be.an("array"));
